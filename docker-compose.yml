services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: pet_first_aid
      POSTGRES_USER: pet_first_aid
      POSTGRES_PASSWORD: pet_first_aid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U pet_first_aid -d pet_first_aid"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"

      DATABASE_URL: >-
        postgresql://pet_first_aid:pet_first_aid@postgres:5432/pet_first_aid

      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}

      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data: